<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Manager Side Panel</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="icons.css">
</head>
<body class="side-panel">
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-title-group">
        <h1 class="title">Tabs</h1>
        <select id="group-view-select" title="Group tabs by">
           <option value="window">By Window</option>
           <option value="domain">By Domain</option>
        </select>
      </div>
      <div class="header-stats">
        <span id="tab-count">0</span>
        <span class="stat-sep">•</span>
        <button id="merge-windows-btn" class="action-btn hidden" title="Merge Selected Windows"><span class="icon icon-merge"></span> Merge</button>
        <button id="auto-group-btn" class="action-btn icon-only" title="Auto Group Tabs"><span class="icon icon-md icon-sparkle"></span></button>
        <button id="theme-toggle" class="action-btn icon-only" title="Toggle Dark Mode"><span class="icon icon-md icon-moon"></span></button>
      </div>
    </header>

    <!-- Search & Filters Section (Compact) -->
    <div class="search-section-compact">
      <input 
        type="text" 
        id="search-input" 
        class="search-input" 
        placeholder="Filter tabs..."
      />
      <div class="filter-chips-compact">
        <label class="filter-chip-icon" title="Filter audible tabs">
          <input type="checkbox" id="filter-audible" />
          <span class="filter-icon"><span class="icon icon-sound"></span></span>
        </label>

        <label class="filter-chip-icon" title="Show Duplicates">
          <input type="checkbox" id="filter-duplicates" />
          <span class="filter-icon"><span class="icon icon-duplicate"></span></span>
        </label>
      </div>
    </div>

    <!-- Tabs List -->
    <div id="tabs-container" class="tabs-container"></div>
  </div>

  <script type="module" src="dist/sidepanel/sidepanel.js"></script>
</body>
</html>
